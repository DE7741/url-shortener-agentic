server.port=8080
spring.application.name=url-shortener-agentic

# Short code settings
shortener.code-length=7

# Rate limiting (redirect hot path)
shortener.rate-limit.capacity=10
shortener.rate-limit.refill-per-second=5

# Orchestrator
orchestrator.audit-dir=./data/audit
orchestrator.max-retries=2
orchestrator.retry-backoff-millis=200

# Optional LLM integration (leave unset for deterministic agents)
# orchestrator.llm.api-key=${OPENAI_API_KEY:}
orchestrator.llm.model=gpt-4o-mini

# Actuator
management.endpoints.web.exposure.include=health,info
